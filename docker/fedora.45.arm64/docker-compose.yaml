version: '2'

volumes:
  kismet_fedora_45_arm64_sysroot:
    external: true

services:
  kismet-build:
    build: .

    environment:
      - CHECKOUT=HEAD
      - VERSION
      - ARCH=arm64
      - ABI=aarch64-redhat-linux
      - BUILD_PLATFORM=fedora_45
      - BUILD_CROSS=1

    command: /scripts/launch/modular.sh

    tmpfs: 
            - /build:exec,mode=777

    volumes:
      - ${BASE_DIR}/rpms-fedora45:/dpkgs
      - ${BASE_DIR}/scripts:/scripts:ro
      - ${SRC_DIR}:/kismet:ro
      - kismet_fedora_45_arm64_sysroot:/sysroot:ro
